[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ETLai"
version = "0.3.3"
description = "Local, folder-driven Dagster CSV transformation engine with hot-folder sensors, AI-assisted pipeline creation, and Tkinter configuration UI."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Umangjeet Singh Pahwa"},
]
dependencies = [
    "dagster>=1.5",
    "dagster-webserver>=1.5",
    "pandas>=2.0",
    "faker>=18.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "requests>=2.28",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
etlai = "etlai.cli:main"

[project.urls]
Repository = "https://github.com/umang/ETLai"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
]

[tool.setuptools.packages.find]
include = ["etlai*"]

[tool.setuptools.package-data]
"etlai" = ["scaffold/**/*", "scaffold/*"]
