operations:
  - id: op_1
    from_node: node_1
    operation: join
    description: "Join two sources on a matching key column, select specified columns from each side"
    params:
      left_key: "col_a"
      right_key: "col_b"
      select_from_left: ["col_a", "col_c", "col_d", "col_e", "col_f", "col_g", "col_h", "col_i"]
      select_from_right: ["col_j", "col_k", "col_l"]
    input_columns: ["col_a", "col_b"]
    output_columns: ["col_a", "col_c", "col_d", "col_e", "col_f", "col_g", "col_h", "col_i", "col_j", "col_k", "col_l"]
    depends_on: []

  - id: op_2
    from_node: node_2
    operation: group
    description: "Group rows by a single column and count occurrences"
    params:
      group_by: "col_f"
    input_columns: ["col_f"]
    output_columns: ["col_f", "count_1"]
    depends_on: [op_1]

  - id: op_3
    from_node: node_3
    operation: rename
    description: "Rename output columns from generic to business-facing names"
    params:
      mapping: {"col_f": "output_name_1", "count_1": "output_name_2"}
    input_columns: ["col_f", "count_1"]
    output_columns: ["output_name_1", "output_name_2"]
    depends_on: [op_2]
