name: vlookup_then_groupby
path: ask
min_files: 2
load_files_op_name: vlookup_then_groupby__load_files

inputs:
  - name: student_records
    role: transient
    description: "Student demographic data (name, roll number, religion, gender)"
    pattern: "student*.csv"
  - name: marks_data
    role: transient
    description: "Student exam results (roll number, subject, marks)"
    pattern: "marks*.csv"

steps:
  - atom: vlookup
    form: passthrough
    inputs_map:
      - param: left_file
      - param: right_file
  - atom: groupby
    form: passthrough
  - atom: rename_columns
    form: passthrough

trigger:
  rules:
    - type: inbox_files
      min_files: 2
