name: vlookup_then_groupby

nodes:
  - id: node_1
    operation: join
    params:
      left_key: "col_a"
      right_key: "col_b"
      select_from_left: ["col_a", "col_c", "col_d", "col_e", "col_f", "col_g", "col_h", "col_i"]
      select_from_right: ["col_j", "col_k", "col_l"]
    inputs: [source_1, source_2]
    outputs: ["col_a", "col_c", "col_d", "col_e", "col_f", "col_g", "col_h", "col_i", "col_j", "col_k", "col_l"]

  - id: node_2
    operation: group
    params:
      group_by: "col_f"
    inputs: [node_1]
    outputs: ["col_f", "count_1"]

  - id: node_3
    operation: rename
    params:
      mapping: {"col_f": "output_name_1", "count_1": "output_name_2"}
    inputs: [node_2]
    outputs: ["output_name_1", "output_name_2"]

edges:
  - {from: source_1, to: node_1}
  - {from: source_2, to: node_1}
  - {from: node_1, to: node_2}
  - {from: node_2, to: node_3}

triggers:
  - type: folder_watch
    spec: "*.csv"
